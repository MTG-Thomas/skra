# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  # Noise reduction: drop the walkthrough/summary sections and the
  # review-status churn, and stop auto-replying to comments. The review
  # itself still runs (one comment per PR). Set auto_review.enabled: false
  # to make reviews manual via `@coderabbitai review`.
  high_level_summary: false
  poem: false
  review_status: false
  review_details: false
  sequence_diagrams: false
  changed_files_summary: false
  auto_review:
    enabled: true
    drafts: false

chat:
  auto_reply: false

