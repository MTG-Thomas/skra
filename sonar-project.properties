# TEMPORARY (PR #79): keep the historic project key until the SonarCloud
# project-key rename is done server-side (see issue #85). The MTG-Thomas_skra
# project exists but has no main-branch baseline, so analyzing there would
# strand history. Revert this hunk when the server-side rename lands.
sonar.projectKey=MTG-Thomas_bifrost-docs
sonar.organization=mtg-thomas
sonar.projectName=Bifrost Docs

sonar.sources=api/src,client/src,scripts,tools/itglue-migrate/src
sonar.tests=api/tests,client/e2e/tests,tests,tools/itglue-migrate/tests,scripts/tests
sonar.python.version=3.11

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.venv/**,**/__pycache__/**,**/.pytest_cache/**,**/.ruff_cache/**,**/coverage/**,**/htmlcov/**,**/test-results/**,**/playwright-report/**,scripts/tests/**
sonar.coverage.exclusions=api/tests/**,client/src/**,client/e2e/tests/**,tests/**,tools/itglue-migrate/tests/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.python.coverage.reportPaths=api/coverage.xml,tools/itglue-migrate/coverage.xml
