# Scoped, expiring suppressions for pip-vendored findings (issue #82).
#
# Provenance (verified against the published digest, not inferred):
# setuptools is 84.0.0 in both /opt/venv and system site-packages, and no
# standalone msgpack distribution exists anywhere in the image. The flagged
# versions appear only in pip's vendored SBOM manifests
# (pip/_vendor/vendor.txt and pip/_vendor/bom.cdx.json), which Trivy v0.70.0
# inventories as installed packages (v0.74.0 reports zero on the same
# digest). The app never imports standalone msgpack and never invokes pip,
# setuptools, or vendored code at runtime.
#
# Scope: each entry lists the exact vendored SBOM purls, verified effective
# in Trivy v0.70.0 (matching purls suppress; non-matching purls do not, and
# paths: scoping has no effect on these generic-target findings). A future
# genuine install reports under a different versioned purl and still fires.
# Residual risk: a future install of these exact versions under these exact
# purls would stay hidden until expiry below. Revisit via issue #91.
vulnerabilities:
  - id: GHSA-6v7p-g79w-8964
    purls:
      - pkg:pypi/msgpack@1.1.2
    expired_at: 2026-10-19
    statement: pip-vendored msgpack only; no standalone install; unreachable at runtime.
  - id: CVE-2025-47273
    purls:
      - pkg:pypi/setuptools@70.3.0
    expired_at: 2026-10-19
    statement: pip-vendored SBOM entry only; image carries setuptools 84.0.0.
