name: skra-dev

# Development overrides for docker-compose.yml
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# This file adds development-specific configuration:
# - Hot reload with volume mounts for live code changes
# - Development-specific Dockerfiles (dependencies only)
# - Debug port for VS Code attachment
# - Exposed ports for direct service access (Garage S3, Postgres)
# - Development environment defaults

services:
  # PostgreSQL - expose port for direct access (e.g. psql, TablePlus)
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skradev}
    ports:
      - "5433:5432"

  # Valkey - expose port for direct access (e.g. redis-cli, RedisInsight)
  valkey:
    ports:
      - "6379:6379"

  # Garage - expose ports for direct access
  garage:
    ports:
      - "3900:3900"  # S3 API
      - "3903:3903"  # Admin API (dev only — not needed in production)

  # Init container - build from local Dockerfile + development password default
  init:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      SKRA_SECRET_KEY: ${SKRA_SECRET_KEY:-dev-secret-key-change-in-production-must-be-32-chars}
      SKRA_DATABASE_URL: postgresql+asyncpg://skra:${POSTGRES_PASSWORD:-skradev}@pgbouncer:5432/skra
      SKRA_DATABASE_URL_SYNC: postgresql://skra:${POSTGRES_PASSWORD:-skradev}@pgbouncer:5432/skra
    volumes:
      - ./api/alembic:/app/alembic:ro
      - ./api/alembic.ini:/app/alembic.ini:ro
      - ./api/scripts:/app/scripts:ro

  # API with hot reload for development - build from local Dockerfile
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      # Dev stage carries debugpy; default (production) target never does.
      target: dev
    ports:
      - "8000:8000"
      - "5678:5678" # debugpy attach (ENABLE_DEBUG=true only)
    environment:
      SKRA_ENVIRONMENT: development
      SKRA_DEBUG: ${SKRA_DEBUG:-true}
      SKRA_SECRET_KEY: ${SKRA_SECRET_KEY:-dev-secret-key-change-in-production-must-be-32-chars}
      SKRA_DATABASE_URL: postgresql+asyncpg://skra:${POSTGRES_PASSWORD:-skradev}@pgbouncer:5432/skra
      SKRA_DATABASE_URL_SYNC: postgresql://skra:${POSTGRES_PASSWORD:-skradev}@pgbouncer:5432/skra
      SKRA_S3_SECRET_KEY: ${GARAGE_SECRET_ACCESS_KEY:-skradevsecret00000000000}
      SKRA_S3_ACCESS_KEY: ${GARAGE_ACCESS_KEY_ID:-skradevkey}
      SKRA_S3_PUBLIC_ENDPOINT: ${SKRA_S3_PUBLIC_ENDPOINT:-http://localhost:3900}
      # Debugging (optional - enables debugpy)
      ENABLE_DEBUG: ${ENABLE_DEBUG:-false}
    volumes:
      - ./api/src:/app/src:ro
      - ./api/alembic:/app/alembic:ro
      - ./api/alembic.ini:/app/alembic.ini:ro
    # Exec form (list): never word-split by Compose, unlike the old shell string.
    command:
      - sh
      - -c
      - |
        if [ "$$ENABLE_DEBUG" = "true" ]; then
          echo 'Starting with debugpy - waiting for VS Code to attach on port 5678...' &&
          exec python -m debugpy --listen 0.0.0.0:5678 --wait-for-client -m uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src;
        else
          exec uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src;
        fi

  # Worker with hot reload for development
  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      SKRA_SECRET_KEY: ${SKRA_SECRET_KEY:-dev-secret-key-change-in-production-must-be-32-chars}
      SKRA_DATABASE_URL: postgresql+asyncpg://skra:${POSTGRES_PASSWORD:-skradev}@pgbouncer:5432/skra
      SKRA_DATABASE_URL_SYNC: postgresql://skra:${POSTGRES_PASSWORD:-skradev}@pgbouncer:5432/skra
      SKRA_S3_ENDPOINT: http://garage:3900
      SKRA_REDIS_URL: redis://valkey:6379/0
    volumes:
      - ./api/src:/app/src:ro
    command: arq src.worker.WorkerSettings --watch ./src

  # Client with hot reload for development
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
      target: "" # Clear the production target from base compose file
    environment:
      API_URL: http://api:8000
    # node:20-slim has no wget (base file probes nginx): probe the Vite
    # /health proxy via node itself. Port 80 matches Dockerfile.dev.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - ./client/index.html:/app/index.html
      - ./client/vite.config.ts:/app/vite.config.ts
      - ./client/tsconfig.json:/app/tsconfig.json
      - ./client/tsconfig.app.json:/app/tsconfig.app.json
      - ./client/tsconfig.node.json:/app/tsconfig.node.json
      - ./client/postcss.config.js:/app/postcss.config.js
      - ./client/tailwind.config.js:/app/tailwind.config.js
      - ./client/components.json:/app/components.json
