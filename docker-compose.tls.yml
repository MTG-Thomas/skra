# Docker Compose TLS Configuration
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.tls.yml up -d
#
# This adds TLS/HTTPS termination using nginx with Let's Encrypt or custom certificates.

services:
  nginx:
    ports:
      # Add HTTPS port
      - "443:443"
    volumes:
      # TLS certificates (Let's Encrypt or custom)
      - ./certs:/etc/nginx/certs:ro
      # Certbot webroot for ACME challenges
      - ./certbot/www:/var/www/certbot:ro
      # Production nginx config with TLS
      - ./config/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      # Force nginx to use production config
      - NGINX_HOST=${SKRA_DOMAIN:-docs.example.com}
