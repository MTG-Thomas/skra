# Skra Docker Stack - Isolated Test Environment
#
# This compose file creates a completely isolated test environment with:
# - Separate container names (skra-test-*)
# - NO exposed ports (all communication via Docker network)
# - Fresh database for each test run
# - PgBouncer for connection pooling (matches production)
#
# NOTE: Ports are NOT exposed to the host, allowing tests to run while
# the development stack is running on the default ports.
#
# Usage:
#   ./test.sh                          # Run unit/integration tests
#   ./test.sh tests/unit/ -v           # Run only unit tests

name: skra-test

services:
  # PostgreSQL Database (Test) - with pgvector extension
  # Uses an isolated test volume so the production/dev database volume is never reused.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: skra-test-postgres
    environment:
      POSTGRES_DB: skra_test
      POSTGRES_USER: skra
      POSTGRES_PASSWORD: skratest
    # No ports exposed - all access via Docker network
    volumes:
      - skratest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skra -d skra_test"]
      interval: 2s
      timeout: 5s
      retries: 10

  # PgBouncer - Connection Pooler (Test)
  # All services connect through PgBouncer, matching production architecture
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: skra-test-pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: skra_test
      DB_USER: skra
      DB_PASSWORD: skratest
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 10
      MIN_POOL_SIZE: 2
      RESERVE_POOL_SIZE: 2
      AUTH_TYPE: plain
    # No ports exposed - all access via Docker network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432", "-U", "skra"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Redis (Test)
  redis:
    image: redis:7-alpine
    container_name: skra-test-redis
    command: redis-server
    # No ports exposed - all access via Docker network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Init Container (Test) - Runs migrations before tests start
  init:
    build:
      context: ./api
      dockerfile: Dockerfile.test
    container_name: skra-test-init
    environment:
      SKRA_DATABASE_URL: postgresql+asyncpg://skra:skratest@pgbouncer:5432/skra_test
      SKRA_DATABASE_URL_SYNC: postgresql://skra:skratest@pgbouncer:5432/skra_test
      SKRA_REDIS_URL: redis://redis:6379/0
      SKRA_SECRET_KEY: test-secret-key-for-e2e-testing-must-be-32-chars
      SKRA_ENVIRONMENT: testing
    volumes:
      - ./api/src:/app/src:ro
      - ./api/alembic:/app/alembic:ro
      - ./api/alembic.ini:/app/alembic.ini:ro
      - ./api/scripts:/app/scripts:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  # FastAPI Application (Test) - Only started for E2E tests
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: skra-test-api
    environment:
      # Database via PgBouncer (matches production architecture)
      SKRA_DATABASE_URL: postgresql+asyncpg://skra:skratest@pgbouncer:5432/skra_test
      SKRA_DATABASE_URL_SYNC: postgresql://skra:skratest@pgbouncer:5432/skra_test
      SKRA_REDIS_URL: redis://redis:6379/0
      SKRA_SECRET_KEY: test-secret-key-for-e2e-testing-must-be-32-chars
      SKRA_ENVIRONMENT: testing
    # No ports exposed - all access via Docker network (test-runner connects to api:8000)
    volumes:
      - ./api/src:/app/src:ro
      - ./api/alembic:/app/alembic:ro
      - ./api/alembic.ini:/app/alembic.ini:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    profiles:
      - e2e  # Only start in E2E mode

  # Test Runner - Executes pytest inside container with all dependencies
  test-runner:
    build:
      context: ./api
      dockerfile: Dockerfile.test
    container_name: skra-test-runner
    environment:
      # Database via PgBouncer (matches production architecture)
      SKRA_DATABASE_URL: postgresql+asyncpg://skra:skratest@pgbouncer:5432/skra_test
      SKRA_DATABASE_URL_SYNC: postgresql://skra:skratest@pgbouncer:5432/skra_test
      SKRA_REDIS_URL: redis://redis:6379/0
      SKRA_SECRET_KEY: test-secret-key-for-e2e-testing-must-be-32-chars
      SKRA_ENVIRONMENT: testing
      # For E2E tests, point to the API container
      TEST_API_URL: http://api:8000
      PYTHONPATH: /app
    volumes:
      - ./api/src:/app/src:ro
      - ./api/scripts:/app/scripts:ro
      - ./api/tests:/app/tests:ro
      - ./api/alembic:/app/alembic:ro
      - ./api/alembic.ini:/app/alembic.ini:ro
      - ./api/pyproject.toml:/app/pyproject.toml:ro
    working_dir: /app
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    # Default command runs all tests
    command: ["pytest", "tests/", "-v"]
    profiles:
      - test  # Only start when running tests

  # =============================================================================
  # Client E2E Testing Services (started with --profile client --profile e2e)
  # =============================================================================
  # NOTE: the client depends_on api, which lives in the `e2e` profile.
  # Compose v5 strictly filters inactive profiles, so the client profile
  # alone is an invalid project — always enable both profiles together.

  # Client frontend (Vite dev server)
  # Serves the React app for Playwright browser tests. Builds the explicit
  # `development` stage (Vite on 3000); the Dockerfile default stays the
  # production nginx stage. Source comes from bind mounts, the /api proxy
  # from API_URL/WS_URL below (see client/vite.config.ts).
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: development
    container_name: skra-test-client
    environment:
      # API_URL and WS_URL are used by Vite's proxy config (server-side)
      API_URL: http://api:8000
      WS_URL: ws://api:8000
      # Allow the Compose service hostname through Vite's dev host check so
      # in-network browser runs (CI Playwright container) are served.
      VITE_DEV_ALLOWED_HOSTS: client
    volumes:
      - ./client/src:/app/src:ro
      - ./client/public:/app/public:ro
      - ./client/index.html:/app/index.html:ro
      - ./client/vite.config.ts:/app/vite.config.ts:ro
      - ./client/tailwind.config.ts:/app/tailwind.config.ts:ro
      - ./client/tsconfig.json:/app/tsconfig.json:ro
      - ./client/tsconfig.app.json:/app/tsconfig.app.json:ro
      - ./client/tsconfig.node.json:/app/tsconfig.node.json:ro
      - ./client/components.json:/app/components.json:ro
      - ./client/postcss.config.js:/app/postcss.config.js:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # node:20-slim carries node (no curl). The dev stage serves Vite on
      # 3000, so this probe matches reality.
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 30
    profiles:
      - client  # Only start when --profile client is used

volumes:
  skratest_postgres_data:
