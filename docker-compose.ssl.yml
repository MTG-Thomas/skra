# SSL/TLS Configuration for dev.docs.midtowntg.com
# Adds nginx SSL reverse proxy in front of the client

services:
  # SSL Reverse Proxy - terminates HTTPS and proxies to client
  ssl-proxy:
    image: nginx:alpine
    container_name: skra-ssl-proxy
    ports:
      - "443:443"   # HTTPS
      - "80:80"     # HTTP (redirects to HTTPS)
    volumes:
      # SSL certificates
      - /etc/letsencrypt/live/dev.docs.midtowntg.com/fullchain.pem:/etc/nginx/ssl/cert.pem:ro
      - /etc/letsencrypt/live/dev.docs.midtowntg.com/privkey.pem:/etc/nginx/ssl/key.pem:ro
      # Nginx config
      - ./config/nginx-ssl-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--no-check-certificate", "--header", "Host: dev.docs.midtowntg.com", "https://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Auto-renewal service for certificates
  certbot-renew:
    image: certbot/certbot:latest
    container_name: skra-certbot-renew
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ~/.secrets/certbot:/secrets:ro
    entrypoint: >
      sh -c "echo '0 0,12 * * * certbot renew --quiet --dns-cloudflare --dns-cloudflare-credentials /secrets/cloudflare.ini' | crontab - && crond -f"
    restart: unless-stopped
    profiles:
      - ssl-renewal  # Only start when explicitly requested
