apiVersion: v1
kind: ConfigMap
metadata:
  name: skra-config
  namespace: skra
  labels:
    app.kubernetes.io/name: skra
    app.kubernetes.io/part-of: skra
data:
  # Environment
  SKRA_ENVIRONMENT: "production"
  SKRA_DEBUG: "false"

  # S3 Configuration (non-sensitive)
  SKRA_S3_BUCKET: "gocovi-skra"
  SKRA_S3_REGION: "us-east-1"

  # JWT Settings
  SKRA_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  SKRA_REFRESH_TOKEN_EXPIRE_DAYS: "7"

  # MFA Settings
  SKRA_MFA_ENABLED: "true"
  SKRA_MFA_TOTP_ISSUER: "Skra"

  # WebAuthn/Passkeys Configuration
  SKRA_WEBAUTHN_RP_ID: "docs.gocovi.com"
  SKRA_WEBAUTHN_RP_NAME: "Skra"
  SKRA_WEBAUTHN_ORIGIN: "https://docs.gocovi.com"

  # CORS
  SKRA_CORS_ORIGINS: "https://docs.gocovi.com"
