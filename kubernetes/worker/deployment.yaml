apiVersion: apps/v1
kind: Deployment
metadata:
  name: skra-worker
  namespace: skra
  labels:
    app.kubernetes.io/name: skra-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: skra
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: skra-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skra-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: skra
    spec:
      containers:
        - name: worker
          image: ghcr.io/mtg-thomas/skra-api:latest
          command: ["arq", "src.worker.WorkerSettings"]
          envFrom:
            - configMapRef:
                name: skra-config
            - secretRef:
                name: skra-secrets
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
          volumeMounts:
            # Sole writable path: CPython tempfile use. The worker talks to
            # Redis/OpenAI over the network and streams files via S3/memory,
            # so no other scratch mount is needed. Secrets stay as envFrom
            # (no secret volumes to mount read-only).
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # Worker doesn't have HTTP endpoint, use exec probe
          livenessProbe:
            exec:
              command:
                - python
                - -c
                # NOTE: exec probes run without a shell, so ${...} would be
                # passed literally; read the environment from Python instead.
                - "import os, redis; redis.from_url(os.environ['SKRA_REDIS_URL']).ping()"
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      # Fixed UID/GID 15000 matches the non-root `app` user baked into
      # api/Dockerfile (garage-init chowns shared creds to 15000:15000);
      # kubelet chowns the emptyDir scratch to the same identity.
      securityContext:
        runAsNonRoot: true
        runAsUser: 15000
        runAsGroup: 15000
        fsGroup: 15000
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
