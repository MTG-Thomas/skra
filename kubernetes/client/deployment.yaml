apiVersion: apps/v1
kind: Deployment
metadata:
  name: skra-client
  namespace: skra
  labels:
    app.kubernetes.io/name: skra-client
    app.kubernetes.io/component: client
    app.kubernetes.io/part-of: skra
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: skra-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skra-client
        app.kubernetes.io/component: client
        app.kubernetes.io/part-of: skra
    spec:
      containers:
        - name: client
          image: ghcr.io/mtg-thomas/skra-client:latest
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
