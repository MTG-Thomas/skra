apiVersion: apps/v1
kind: Deployment
metadata:
  name: skra-api
  namespace: skra
  labels:
    app.kubernetes.io/name: skra-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: skra
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: skra-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skra-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: skra
    spec:
      # Init container runs migrations before API starts. Alembic performs no
      # local writes (database only); the /tmp scratch below covers CPython
      # tempfile use under a read-only root.
      initContainers:
        - name: init
          image: ghcr.io/mtg-thomas/skra-api:latest
          command: ["python", "-m", "scripts.init_container"]
          envFrom:
            - configMapRef:
                name: skra-config
            - secretRef:
                name: skra-secrets
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          image: ghcr.io/mtg-thomas/skra-api:latest
          command:
            ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: skra-config
            - secretRef:
                name: skra-secrets
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
          volumeMounts:
            # Sole writable path: CPython tempfile + Starlette multipart
            # spool. Attachments move via S3 presigned URLs and exports are
            # built in memory, so no other scratch mount is needed. Secrets
            # stay as envFrom (no secret volumes to mount read-only).
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      # Fixed UID/GID 15000 matches the non-root `app` user baked into
      # api/Dockerfile (garage-init chowns shared creds to 15000:15000);
      # kubelet chowns the emptyDir scratch to the same identity.
      securityContext:
        runAsNonRoot: true
        runAsUser: 15000
        runAsGroup: 15000
        fsGroup: 15000
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
