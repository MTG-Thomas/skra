# Skra Secrets Template
#
# IMPORTANT: Do NOT commit this file with actual values!
# This is a template showing the required secrets.
#
# For production, use sealed-secrets via the seal-secret.sh script in the kubernetes repo:
#   cd /path/to/kubernetes
#   ./seal-secret.sh --secret-name skra-secrets --namespace skra --key SKRA_SECRET_KEY --value 'your-value'
#
# Or create secrets directly using kubectl:
#   kubectl create secret generic skra-secrets \
#     --namespace=skra \
#     --from-literal=SKRA_SECRET_KEY='your-32-char-secret-key-here' \
#     --from-literal=SKRA_DATABASE_URL='postgresql+asyncpg://user:pass@host:5432/skra' \
#     --from-literal=SKRA_DATABASE_URL_SYNC='postgresql://user:pass@host:5432/skra' \
#     --from-literal=SKRA_REDIS_URL='redis://host:6379/0' \
#     --from-literal=SKRA_S3_ENDPOINT_URL='https://nyc3.digitaloceanspaces.com' \
#     --from-literal=SKRA_S3_ACCESS_KEY='your-access-key' \
#     --from-literal=SKRA_S3_SECRET_KEY='your-secret-key'

apiVersion: v1
kind: Secret
metadata:
  name: skra-secrets
  namespace: skra
  labels:
    app.kubernetes.io/name: skra
    app.kubernetes.io/part-of: skra
type: Opaque
stringData:
  # Required: 32+ character secret for JWT signing and Fernet encryption
  SKRA_SECRET_KEY: "REPLACE_WITH_32_CHAR_SECRET_KEY"

  # Required: PostgreSQL connection strings (use managed DB)
  SKRA_DATABASE_URL: "postgresql+asyncpg://skra:password@postgres.example.com:5432/skra"
  SKRA_DATABASE_URL_SYNC: "postgresql://skra:password@postgres.example.com:5432/skra"

  # Required: Redis connection (managed Redis)
  SKRA_REDIS_URL: "redis://redis.example.com:6379/0"

  # Required: S3-compatible storage (DigitalOcean Spaces)
  SKRA_S3_ENDPOINT_URL: "https://nyc3.digitaloceanspaces.com"
  SKRA_S3_ACCESS_KEY: "REPLACE_WITH_ACCESS_KEY"
  SKRA_S3_SECRET_KEY: "REPLACE_WITH_SECRET_KEY"

  # Optional: OpenAI API key for vector search
  # SKRA_OPENAI_API_KEY: ""
