# Development environment overlay
# Uses smaller resource allocations and local/shared infrastructure

namespace: skra

resources:
  - ../skra/
  - ../platform/network-policies/

# Development-specific patches
patches:
  # Reduce replica count
  - target:
      kind: Deployment
      name: skra-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: skra-client
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: skra-worker
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  # Relax resource limits for dev
  - target:
      kind: ResourceQuota
      name: skra-quota
    patch: |
      - op: replace
        path: /spec/hard/limits.cpu
        value: "2"
      - op: replace
        path: /spec/hard/limits.memory
        value: 4Gi

configMapGenerator:
  - name: skra-config
    behavior: merge
    literals:
      - SKRA_ENVIRONMENT=development
      - SKRA_DEBUG=true
      - BIFROST_API_URL=http://external-bifrost-api.skra.svc.cluster.local:8000
