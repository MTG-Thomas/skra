# Staging environment overlay
# Mirrors production but with smaller scale

namespace: skra

resources:
  - ../skra/
  - ../platform/network-policies/

patches:
  # Two replicas for HA testing
  - target:
      kind: Deployment
      name: skra-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  # Update hostnames
  - target:
      kind: Ingress
      name: skra
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: docs-staging.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: docs-staging.example.com
      - op: replace
        path: /spec/tls/0/secretName
        value: skra-staging-tls

configMapGenerator:
  - name: skra-config
    behavior: merge
    literals:
      - SKRA_ENVIRONMENT=staging
      - SKRA_DEBUG=false
      - BIFROST_API_URL=http://external-bifrost-api.skra.svc.cluster.local:8000
