# Production environment overlay
# Full scale with all protections enabled

namespace: skra

resources:
  - ../skra/
  - ../platform/network-policies/

patches:
  # Production replica counts
  - target:
      kind: Deployment
      name: skra-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: skra-client
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: skra-worker
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  # Production hostname
  - target:
      kind: Ingress
      name: skra
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: docs.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: docs.example.com
      - op: replace
        path: /spec/tls/0/secretName
        value: skra-tls

configMapGenerator:
  - name: skra-config
    behavior: merge
    literals:
      - SKRA_ENVIRONMENT=production
      - SKRA_DEBUG=false
      - BIFROST_API_URL=http://external-bifrost-api.skra.svc.cluster.local:8000
