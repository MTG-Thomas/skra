# Kustomization for skra namespace
# This is a reference structure - actual app resources should be imported from existing manifests

namespace: skra

resources:
  - namespace.yaml
  - resource-quota.yaml
  - limit-range.yaml
  - ingress.yaml
  - external-service-bifrost.yaml
  # Import existing app resources
  - ../../api/deployment.yaml
  - ../../api/service.yaml
  - ../../client/deployment.yaml
  - ../../client/service.yaml
  - ../../worker/deployment.yaml

# Patches to ensure resources target correct namespace
patches:
  - target:
      kind: Deployment
      namespace: skra
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/configMapRef/name
        value: skra-config
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/1/secretRef/name
        value: skra-secrets
  - target:
      kind: ConfigMap
      name: skra-config
    patch: |
      - op: add
        path: /data/BIFROST_API_URL
        value: "http://external-bifrost-api.skra.svc.cluster.local:8000"
