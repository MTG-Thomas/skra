name: bifrost-docs

# Bifrost Docs Docker Stack - Production Configuration
#
# Usage:
#   docker compose up              # Start all services
#   docker compose up -d           # Start in background
#   docker compose logs -f api     # Follow API logs
#
# For development with hot reload:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Required environment variables:
#   BIFROST_DOCS_SECRET_KEY   - 32+ char secret for JWT signing and secret encryption
#   POSTGRES_PASSWORD   - PostgreSQL password
#
# The BIFROST_DOCS_SECRET_KEY is critical - it's used for:
#   - JWT token signing (HS256)
#   - Fernet encryption of passwords stored in PostgreSQL
#   - Must be consistent across all services
#   - Changing it will invalidate all existing tokens and encrypted data

services:
  # PostgreSQL Database (with pgvector extension for semantic search)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bifrost-docs-postgres
    environment:
      POSTGRES_DB: bifrost_docs
      POSTGRES_USER: bifrost_docs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - bifrost_docspostgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bifrost_docs -d bifrost_docs"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Garage (S3-compatible object storage — MPL-2.0, replaces AGPL MinIO)
  # Scratch image: only /garage binary available — no shell, no curl
  garage:
    image: dxflrs/garage:v1.3.1
    container_name: bifrost-docs-garage
    volumes:
      - ./config/garage.toml:/etc/garage.toml:ro
      - bifrost_docsgarage_meta:/var/lib/garage/meta
      - bifrost_docsgarage_data:/var/lib/garage/data
    # Ports only exposed in docker-compose.dev.yml
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 10s

  # Garage Initialization — assigns layout, creates bucket and access key
  # Uses alpine:3 (has wget + sh) to hit the Garage admin HTTP API
  # Note: No healthcheck - this is a one-shot container that exits after initialization
  garage-init:
    image: alpine:3
    container_name: bifrost-docs-garage-init
    depends_on:
      garage:
        condition: service_healthy
    volumes:
      - ./scripts/garage-init.sh:/garage-init.sh:ro
      - bifrost_docsgarage_creds:/run/garage-creds
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN is required}
      # Key lifecycle (issues #107, #109). Mode auto-selects: legacy pair
      # present => import (existing installs); absent => managed, minting via
      # POST /v1/key into /run/garage-creds/s3.env. Explicit GARAGE_KEY_MODE
      # always wins; partial pair fails closed.
      GARAGE_KEY_MODE: ${GARAGE_KEY_MODE:-}
      GARAGE_KEY_NAME: ${GARAGE_KEY_NAME:-bifrost-docs-key}
      GARAGE_CREDS_FILE: /run/garage-creds/s3.env
      # Must match the pinned app uid/gid in api/Dockerfile (15000).
      GARAGE_CREDS_UID: ${GARAGE_CREDS_UID:-15000}
      GARAGE_CREDS_GID: ${GARAGE_CREDS_GID:-15000}
      GARAGE_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:-}
      GARAGE_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:-}
      GARAGE_ROTATE: ${GARAGE_ROTATE:-}
      GARAGE_REVOKE_KEY_ID: ${GARAGE_REVOKE_KEY_ID:-}
    entrypoint: ["sh", "/garage-init.sh"]

  # Valkey (Redis-compatible cache and pub/sub — BSD-3-Clause, replaces SSPL Redis)
  valkey:
    image: valkey/valkey:8-alpine
    container_name: bifrost-docs-valkey
    command: valkey-server --appendonly yes
    # Port only exposed in docker-compose.dev.yml
    volumes:
      - bifrost_docsvalkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PgBouncer - Connection Pooler for PostgreSQL
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: bifrost-docs-pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bifrost_docs
      DB_USER: bifrost_docs
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      AUTH_TYPE: plain
    # Port only exposed in docker-compose.dev.yml
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "localhost",
          "-p",
          "5432",
          "-U",
          "bifrost_docs",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Init Container - Runs migrations before API starts
  # Note: No healthcheck - this is a one-shot container that exits after migrations
  init:
    image: jackmusick/bifrost-docs-api:latest
    container_name: bifrost-docs-init
    environment:
      BIFROST_DOCS_SECRET_KEY: ${BIFROST_DOCS_SECRET_KEY:?BIFROST_DOCS_SECRET_KEY is required (32+ chars)}
      BIFROST_DOCS_DATABASE_URL: postgresql+asyncpg://bifrost_docs:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@pgbouncer:5432/bifrost_docs
      BIFROST_DOCS_DATABASE_URL_SYNC: postgresql://bifrost_docs:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@pgbouncer:5432/bifrost_docs
    depends_on:
      pgbouncer:
        condition: service_healthy
    command: python -m scripts.init_container

  # FastAPI Application
  api:
    image: jackmusick/bifrost-docs-api:latest
    container_name: bifrost-docs-api
    volumes:
      - bifrost_docsgarage_creds:/run/garage-creds:ro
    environment:
      # Core
      BIFROST_DOCS_ENVIRONMENT: ${BIFROST_DOCS_ENVIRONMENT:-production}
      BIFROST_DOCS_DEBUG: ${BIFROST_DOCS_DEBUG:-false}
      BIFROST_DOCS_SECRET_KEY: ${BIFROST_DOCS_SECRET_KEY:?BIFROST_DOCS_SECRET_KEY is required (32+ chars)}
      # Database (via PgBouncer for connection pooling)
      BIFROST_DOCS_DATABASE_URL: postgresql+asyncpg://bifrost_docs:${POSTGRES_PASSWORD}@pgbouncer:5432/bifrost_docs
      BIFROST_DOCS_DATABASE_URL_SYNC: postgresql://bifrost_docs:${POSTGRES_PASSWORD}@pgbouncer:5432/bifrost_docs
      # Redis
      BIFROST_DOCS_REDIS_URL: redis://valkey:6379/0
      # CORS (only needed if API is accessed directly, not through proxy)
      BIFROST_DOCS_CORS_ORIGINS: ${BIFROST_DOCS_CORS_ORIGINS:-http://localhost:3000}
      # JWT (optional, has defaults)
      BIFROST_DOCS_ACCESS_TOKEN_EXPIRE_MINUTES: ${BIFROST_DOCS_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      BIFROST_DOCS_REFRESH_TOKEN_EXPIRE_DAYS: ${BIFROST_DOCS_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # MFA (optional, has defaults)
      BIFROST_DOCS_MFA_ENABLED: ${BIFROST_DOCS_MFA_ENABLED:-true}
      BIFROST_DOCS_MFA_TOTP_ISSUER: ${BIFROST_DOCS_MFA_TOTP_ISSUER:-BifrostDocs}
      # WebAuthn/Passkeys
      BIFROST_DOCS_WEBAUTHN_RP_ID: ${BIFROST_DOCS_WEBAUTHN_RP_ID:-localhost}
      BIFROST_DOCS_WEBAUTHN_RP_NAME: ${BIFROST_DOCS_WEBAUTHN_RP_NAME:-Bifrost Docs}
      BIFROST_DOCS_WEBAUTHN_ORIGIN: ${BIFROST_DOCS_WEBAUTHN_ORIGIN:-http://localhost:3000}
      # S3/Garage Storage (credentials come from the garage-creds volume
      # written by garage-init in managed mode; explicit BIFROST_DOCS_S3_*
      # env below still wins when set)
      BIFROST_DOCS_S3_ENDPOINT: http://garage:3900
      BIFROST_DOCS_S3_CREDENTIALS_FILE: /run/garage-creds/s3.env
      BIFROST_DOCS_S3_BUCKET: ${BIFROST_DOCS_S3_BUCKET:-bifrost-docs}
      BIFROST_DOCS_S3_REGION: us-east-1
      # OpenAI (for vector search)
      BIFROST_DOCS_OPENAI_API_KEY: ${BIFROST_DOCS_OPENAI_API_KEY:-}
      BIFROST_DOCS_OPENAI_EMBEDDING_MODEL: ${BIFROST_DOCS_OPENAI_EMBEDDING_MODEL:-text-embedding-ada-002}
    # Note: API port not exposed - access via client proxy at http://localhost:3000
    # Debug port (5678) only exposed in docker-compose.dev.yml
    depends_on:
      init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000

  # arq Worker (processes indexing queue)
  worker:
    image: jackmusick/bifrost-docs-api:latest
    container_name: bifrost-docs-worker
    volumes:
      - bifrost_docsgarage_creds:/run/garage-creds:ro
    environment:
      BIFROST_DOCS_SECRET_KEY: ${BIFROST_DOCS_SECRET_KEY:?BIFROST_DOCS_SECRET_KEY is required (32+ chars)}
      BIFROST_DOCS_DATABASE_URL: postgresql+asyncpg://bifrost_docs:${POSTGRES_PASSWORD}@pgbouncer:5432/bifrost_docs
      BIFROST_DOCS_REDIS_URL: redis://valkey:6379/0
      # Same managed S3 credentials as api (issue #107); the worker image is
      # the api image, so the same uid-pinned app identity applies.
      BIFROST_DOCS_S3_CREDENTIALS_FILE: /run/garage-creds/s3.env
    depends_on:
      init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    command: arq src.worker.WorkerSettings
    # Custom healthcheck for ARQ worker - verifies process and Redis connectivity
    healthcheck:
      test: ["CMD", "python", "/app/scripts/worker_healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend (Vite/React)
  client:
    image: jackmusick/bifrost-docs-client:latest
    container_name: bifrost-docs-client
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    # Healthcheck: verifies nginx is accepting connections.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  bifrost_docspostgres_data:
  bifrost_docsvalkey_data:
  bifrost_docsgarage_meta:
  bifrost_docsgarage_data:
  bifrost_docsgarage_creds:
