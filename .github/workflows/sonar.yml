name: SonarQube

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

jobs:
  sonar:
    name: SonarQube Scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: skra
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: skra_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    permissions:
      contents: read
      pull-requests: read

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Skip when SONAR_TOKEN is not configured
        if: env.SONAR_TOKEN == ''
        run: |
          echo "SONAR_TOKEN is not configured; skipping SonarQube scan."

      - name: Set up Python for API coverage
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './api/pyproject.toml'

      - name: Generate API coverage
        if: env.SONAR_TOKEN != ''
        working-directory: ./api
        env:
          SKRA_SECRET_KEY: test-secret-key-must-be-at-least-32-characters-long
          SKRA_DATABASE_URL: postgresql+asyncpg://skra:testpassword@localhost:5432/skra_test
          SKRA_DATABASE_URL_SYNC: postgresql://skra:testpassword@localhost:5432/skra_test
          SKRA_REDIS_URL: redis://localhost:6379/0
          SKRA_ENVIRONMENT: testing
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pytest tests/unit --cov=src --cov-report=xml:coverage.xml --cov-report=term

      - name: Set up Python for migration-tool coverage
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './tools/itglue-migrate/pyproject.toml'

      - name: Generate migration-tool coverage
        if: env.SONAR_TOKEN != ''
        working-directory: ./tools/itglue-migrate
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pytest tests/unit --cov=src --cov-report=xml:coverage.xml --cov-report=term

      - name: Run SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.0.0
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

