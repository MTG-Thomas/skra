name: OWASP ZAP Baseline

on:
  workflow_dispatch:
    inputs:
      target:
        description: Sanctioned Azure proof target to scan
        required: true
        default: all
        type: choice
        options:
          - all
          - frontend
          - api
  schedule:
    - cron: "22 7 * * 1"

permissions:
  contents: read

jobs:
  select-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Select sanctioned targets
        id: targets
        env:
          TARGET: ${{ github.event.inputs.target || 'all' }}
        run: |
          case "${TARGET}" in
            all)
              MATRIX='{"include":[{"name":"frontend","url":"https://azure-docs.midtowntg.com"},{"name":"api","url":"https://ca-skra-api-neon-dev.icymoss-8e8097f1.eastus.azurecontainerapps.io"}]}'
              ;;
            frontend)
              MATRIX='{"include":[{"name":"frontend","url":"https://azure-docs.midtowntg.com"}]}'
              ;;
            api)
              MATRIX='{"include":[{"name":"api","url":"https://ca-skra-api-neon-dev.icymoss-8e8097f1.eastus.azurecontainerapps.io"}]}'
              ;;
            *)
              echo "Unsupported target: ${TARGET}" >&2
              exit 1
              ;;
          esac

          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  zap-baseline:
    name: ZAP baseline (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: select-targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select-targets.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run OWASP ZAP passive baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ matrix.url }}
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          allow_issue_writing: false
          fail_action: true
          rules_file_name: .zap/baseline-rules.tsv
          artifact_name: zap-baseline-${{ matrix.name }}
          cmd_options: >-
            -m 3
            -z "-config view.locale=en_GB"

