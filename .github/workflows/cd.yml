name: CD - Deploy Test VM

on:
  workflow_run:
    workflows: ["CI - Test & Build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or ref to deploy. Defaults to current main.
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: skra-test-vm
  cancel-in-progress: false

env:
  # bifrost-docs-dev (ciuser thomas) over the Defined Networking overlay
  # (NetBird retired estate-wide; its 100.103.235.51 is gone). Set to the
  # VM's Nebula IP once dnclient is enrolled there (see #100).
  # TODO(#100): replace placeholder with the enrolled Nebula IP.
  TEST_VM_HOST: 192.0.2.1
  TEST_VM_USER: thomas
  HEALTH_URL: https://dev.docs.midtowntg.com/health
  # Ephemeral runner hostname; must be unique per run (Defined.net
  # rejects duplicate host names). Torn down by the last step.
  DN_RUNNER_NAME: skra-cd-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy-test-vm:
    name: Deploy to skra-dev
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    environment:
      name: skra-dev
      url: https://dev.docs.midtowntg.com
    env:
      DN_API_KEY_PRESENT: ${{ secrets.DN_API_KEY != '' }}
      DN_NETWORK_ID_PRESENT: ${{ secrets.DN_NETWORK_ID != '' }}
      DN_ROLE_ID_PRESENT: ${{ secrets.DN_ROLE_ID != '' }}
      TEST_VM_SSH_KEY_PRESENT: ${{ secrets.TEST_VM_SSH_KEY != '' }}
      TEST_VM_SSH_HOST_KEY_PRESENT: ${{ secrets.TEST_VM_SSH_HOST_KEY != '' }}

    steps:
      - name: Validate deployment secrets
        run: |
          test "${DN_API_KEY_PRESENT}" = "true" || {
            echo "Missing required secret: DN_API_KEY" >&2
            exit 1
          }
          test "${DN_NETWORK_ID_PRESENT}" = "true" || {
            echo "Missing required secret: DN_NETWORK_ID" >&2
            exit 1
          }
          test "${DN_ROLE_ID_PRESENT}" = "true" || {
            echo "Missing required secret: DN_ROLE_ID" >&2
            exit 1
          }
          test "${TEST_VM_SSH_KEY_PRESENT}" = "true" || {
            echo "Missing required secret: TEST_VM_SSH_KEY" >&2
            exit 1
          }
          test "${TEST_VM_SSH_HOST_KEY_PRESENT}" = "true" || {
            echo "Missing required secret: TEST_VM_SSH_HOST_KEY" >&2
            exit 1
          }
          case "${TEST_VM_HOST}" in
            192.0.2.1)
              echo "TEST_VM_HOST is still the placeholder (see #100)" >&2
              exit 1
              ;;
          esac

      - name: Resolve deployment ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            DEPLOY_REF="${{ github.event.workflow_run.head_sha }}"
          elif [ -n "${{ inputs.ref }}" ]; then
            DEPLOY_REF="${{ inputs.ref }}"
          else
            DEPLOY_REF="${{ github.sha }}"
          fi
          {
            echo "deploy_ref=${DEPLOY_REF}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout deployment ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.ref.outputs.deploy_ref }}

      - name: Resolve image tag
        id: image
        run: |
          DEPLOY_SHA="$(git rev-parse HEAD)"
          DEPLOY_SHA_SHORT="$(git rev-parse --short=7 HEAD)"
          {
            echo "deploy_sha=${DEPLOY_SHA}"
            echo "deploy_sha_short=${DEPLOY_SHA_SHORT}"
            echo "api_image=ghcr.io/mtg-thomas/skra-api:${DEPLOY_SHA_SHORT}"
            echo "client_image=ghcr.io/mtg-thomas/skra-client:${DEPLOY_SHA_SHORT}"
          } >> "$GITHUB_OUTPUT"

      - name: Join Defined Networking overlay
        # Third-party action (QuickVM, MIT; pinned to v1 SHA). Enrolls this
        # ephemeral runner under DN_RUNNER_NAME; torn down in the last step.
        uses: quickvm/action-dnclient@b7756d785491796078999ef5d7747010a06c95c62 # v1
        with:
          dn-api-key: ${{ secrets.DN_API_KEY }}
          dn-network-id: ${{ secrets.DN_NETWORK_ID }}
          dn-role-id: ${{ secrets.DN_ROLE_ID }}
          dn-hostname: ${{ env.DN_RUNNER_NAME }}

      - name: Configure SSH key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.TEST_VM_SSH_KEY }}" > ~/.ssh/test_vm_key
          sed -i 's/\r$//' ~/.ssh/test_vm_key
          chmod 600 ~/.ssh/test_vm_key
          printf '%s\n' "${{ secrets.TEST_VM_SSH_HOST_KEY }}" > ~/.ssh/known_hosts
          sed -i 's/\r$//' ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy pinned images on test VM
        env:
          DEPLOY_SHA: ${{ steps.image.outputs.deploy_sha }}
          DEPLOY_SHA_SHORT: ${{ steps.image.outputs.deploy_sha_short }}
          SKRA_API_IMAGE: ${{ steps.image.outputs.api_image }}
          SKRA_CLIENT_IMAGE: ${{ steps.image.outputs.client_image }}
          GHCR_READ_USER: ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ github.token }}
        run: |
          tar -czf /tmp/skra-deploy.tgz \
            scripts/deploy-test-vm.sh \
            docker-compose.yml \
            docker-compose.test-vm.yml \
            docker-compose.ssl.yml
          {
            printf 'DEPLOY_SHA=%q\n' "${DEPLOY_SHA}"
            printf 'DEPLOY_SHA_SHORT=%q\n' "${DEPLOY_SHA_SHORT}"
            printf 'SKRA_API_IMAGE=%q\n' "${SKRA_API_IMAGE}"
            printf 'SKRA_CLIENT_IMAGE=%q\n' "${SKRA_CLIENT_IMAGE}"
            printf 'GHCR_READ_USER=%q\n' "${GHCR_READ_USER}"
            printf 'HEALTH_URL=%q\n' "${HEALTH_URL}"
          } > /tmp/skra-deploy.env
          chmod 600 /tmp/skra-deploy.env

          for attempt in $(seq 1 12); do
            if ssh -i ~/.ssh/test_vm_key -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "${TEST_VM_USER}@${TEST_VM_HOST}" "true"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "SSH to ${TEST_VM_HOST} did not become ready" >&2
              exit 1
            fi
            sleep 5
          done

          scp -i ~/.ssh/test_vm_key -o StrictHostKeyChecking=yes -o ConnectTimeout=10 /tmp/skra-deploy.tgz \
            "${TEST_VM_USER}@${TEST_VM_HOST}:/tmp/skra-deploy.tgz"

          scp -i ~/.ssh/test_vm_key -o StrictHostKeyChecking=yes -o ConnectTimeout=10 /tmp/skra-deploy.env \
            "${TEST_VM_USER}@${TEST_VM_HOST}:/tmp/skra-deploy.env"

          ssh -i ~/.ssh/test_vm_key -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "${TEST_VM_USER}@${TEST_VM_HOST}" \
            "mkdir -p /tmp/skra-deploy && tar -xzf /tmp/skra-deploy.tgz -C /tmp/skra-deploy"

          printf '%s' "${GHCR_READ_TOKEN}" | \
            ssh -i ~/.ssh/test_vm_key -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "${TEST_VM_USER}@${TEST_VM_HOST}" \
              'set -euo pipefail
              chmod 600 /tmp/skra-deploy.env
              trap "rm -f /tmp/skra-deploy.env; docker logout ghcr.io >/dev/null 2>&1 || true" EXIT
              set -a
              . /tmp/skra-deploy.env
              set +a
              ghcr_token="$(cat)"
              printf "%s" "${ghcr_token}" | docker login ghcr.io -u "${GHCR_READ_USER:-MTG-Thomas}" --password-stdin
              unset ghcr_token
              bash /tmp/skra-deploy/scripts/deploy-test-vm.sh'

      - name: Verify public health
        run: curl -fsS "${HEALTH_URL}"

      - name: Remove ephemeral overlay host
        # The dnclient host exists only for this run; delete it so stale
        # runners never accumulate (API key needs hosts:delete scope).
        if: always()
        env:
          DN_API_KEY: ${{ secrets.DN_API_KEY }}
        run: |
          set -u
          host_id="$(curl -fsSL -H "Authorization: Bearer ${DN_API_KEY}" \
            'https://api.defined.net/v2/hosts' \
            | jq -r --arg name "${DN_RUNNER_NAME}" \
              '.hosts[]? // empty | select(.name == $name or .hostname == $name) | .id // empty' \
            | head -n 1)"
          if [ -z "${host_id}" ]; then
            echo "No overlay host named ${DN_RUNNER_NAME}; nothing to remove"
            exit 0
          fi
          curl -fsSL -X DELETE -H "Authorization: Bearer ${DN_API_KEY}" \
            "https://api.defined.net/v2/hosts/${host_id}"
          echo "Removed overlay host ${DN_RUNNER_NAME} (${host_id})"
