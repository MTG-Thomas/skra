name: IT Glue attachment recovery gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/itglue-migrate/**'
      - '.github/workflows/itglue-attachment-checks.yml'
  push:
    branches: [main]
    paths:
      - 'tools/itglue-migrate/**'
      - '.github/workflows/itglue-attachment-checks.yml'

permissions:
  contents: read

jobs:
  attachment-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/itglue-migrate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: '3.11'
      - name: Install declared tool dependencies
        run: pip install -e '.[dev]'
      - name: Check recovered attachment slice
        # Keep baseline cleanup separate from this recovered feature.
        run: |
          ruff check src/itglue_migrate/attachments.py tests/unit/test_attachment_determinism.py
          ruff format --check src/itglue_migrate/attachments.py tests/unit/test_attachment_determinism.py
          pyright src/itglue_migrate/attachments.py tests/unit/test_attachment_determinism.py
      - name: Run complete offline unit suite
        run: pytest tests/unit -q
